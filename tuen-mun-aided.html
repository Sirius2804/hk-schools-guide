<!-- Leaflet.js — 免費互動地圖（OpenStreetMap，毋須API Key） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #1a5276;
    --accent: #2e86c1;
    --accent2: #1a8a6e;
    --text: #1a2a3a;
    --sub: #5a7080;
    --border: #d0dce8;
    --tag-bg: #e8f0f8;
    --tag-text: #1a5276;
    --net70: #1a5276;
    --net71: #7d6608;
    --shadow: 0 2px 12px rgba(26,82,118,0.10);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang HK', 'Noto Sans HK', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: #fff;
    padding: 28px 20px 20px;
    text-align: center;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; }
  header p { font-size: 0.85rem; opacity: 0.85; margin-top: 6px; }
  .net-badges { display: flex; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .net-badge {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.78rem;
    font-weight: 600;
  }

  .stats-bar {
    background: var(--primary);
    color: #fff;
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 10px 20px;
    font-size: 0.82rem;
    flex-wrap: wrap;
  }
  .stats-bar span b { font-size: 1.1rem; }

  .controls {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.9rem;
    color: var(--text);
    outline: none;
    background: var(--bg);
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    border: 1.5px solid var(--border);
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .filter-btn.net70-btn.active { background: var(--net70); border-color: var(--net70); color: #fff; }
  .filter-btn.net71-btn.active { background: var(--net71); border-color: var(--net71); color: #fff; }

  .sort-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--sub);
  }
  .sort-select {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--bg);
    cursor: pointer;
  }
  .result-count { margin-left: auto; color: var(--sub); font-size: 0.8rem; }

  .school-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .school-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .school-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,82,118,0.14); }
  .school-card.selected-compare { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

  .card-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #f8fbff 0%, #eef4fa 100%);
  }
  .card-code-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card-code {
    font-size: 0.72rem;
    color: #fff;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.05em;
  }
  .net70-badge { background: var(--net70); }
  .net71-badge { background: var(--net71); }
  .card-places {
    margin-left: auto;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent2);
    background: #e8f8f0;
    border-radius: 10px;
    padding: 2px 10px;
  }
  .card-name { font-size: 1.02rem; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
  .card-eng { font-size: 0.73rem; color: var(--sub); line-height: 1.3; }

  .card-body { padding: 12px 16px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .tag { font-size: 0.72rem; font-weight: 600; border-radius: 8px; padding: 2px 9px; }
  .tag-finance { background: #e8f0f8; color: #1a5276; }
  .tag-gov { background: #f8e8e8; color: #8e1010; }
  .tag-religion { background: #fdf2e9; color: #784212; }
  .tag-barrier { background: #e8f8e8; color: #186a3b; }

  .card-info-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--sub);
    margin-bottom: 5px;
    line-height: 1.4;
  }
  .card-info-row .icon { flex-shrink: 0; width: 16px; text-align: center; }

  .places-bar-wrap { margin: 8px 0 10px; }
  .places-bar-label { font-size: 0.75rem; color: var(--sub); margin-bottom: 3px; display: flex; justify-content: space-between; }
  .places-bar-bg { background: var(--border); border-radius: 6px; height: 8px; overflow: hidden; }
  .places-bar-fill { background: linear-gradient(90deg, var(--accent), var(--accent2)); height: 100%; border-radius: 6px; }

  .card-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .btn-compare {
    flex: 1;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 8px;
    padding: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-compare:hover, .btn-compare.active { background: var(--accent); color: #fff; }
  .btn-detail {
    flex: 1;
    border: none;
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    padding: 7px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-detail:hover { background: var(--accent); }

  .compare-bar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--primary);
    color: #fff;
    padding: 12px 16px;
    z-index: 200;
    align-items: center;
    gap: 10px;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
    flex-wrap: wrap;
  }
  .compare-bar.show { display: flex; }
  .compare-names { flex: 1; font-size: 0.82rem; min-width: 150px; }
  .compare-names span { background: rgba(255,255,255,0.15); border-radius: 6px; padding: 2px 8px; margin-right: 5px; display: inline-block; margin-bottom: 3px; font-size: 0.78rem; }
  .btn-do-compare { background: #fff; color: var(--primary); border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  .btn-clear-compare { background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; cursor: pointer; }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,20,40,0.6);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: var(--radius);
    width: 100%;
    max-width: 680px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--card);
    z-index: 1;
  }
  .modal-head h3 { font-size: 1rem; color: var(--primary); font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 1.3rem; color: var(--sub); cursor: pointer; padding: 4px 8px; }
  .modal-body { padding: 20px; }

  .compare-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .compare-table th { background: var(--primary); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; }
  .compare-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .compare-table tr:nth-child(even) td { background: var(--bg); }
  .compare-table .row-label { color: var(--sub); font-weight: 600; }

  .detail-section { margin-bottom: 16px; }
  .detail-section h4 {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  .detail-row { display: flex; gap: 10px; margin-bottom: 6px; font-size: 0.87rem; }
  .detail-label { color: var(--sub); min-width: 80px; flex-shrink: 0; }
  .detail-value { color: var(--text); font-weight: 500; }

  .admission-box {
    background: linear-gradient(135deg, #eef4fa, #e8f4ee);
    border: 1px solid #c5d8eb;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.83rem;
    color: var(--text);
    line-height: 1.7;
  }
  .admission-box h5 { font-size: 0.85rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
  .admission-box ul { padding-left: 16px; }
  .admission-box li { margin-bottom: 4px; }

  .empty { text-align: center; color: var(--sub); padding: 60px 20px; font-size: 0.95rem; }

  .tag-happy    { background: #e8f8e8; color: #186a3b; }
  .tag-balanced { background: #fef9e7; color: #7d6608; }
  .tag-academic { background: #fde8e8; color: #8e1010; }

  .profile-snippet {
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.76rem;
    color: var(--sub);
    margin-top: 8px;
    line-height: 1.5;
  }
  .profile-snippet b { color: var(--text); }

  .profile-box {
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 0.83rem;
    line-height: 1.7;
    margin-bottom: 4px;
  }
  .profile-box.happy    { background: #edfbee; border: 1px solid #a9dbb0; }
  .profile-box.balanced { background: #fefce8; border: 1px solid #d4c56a; }
  .profile-box.academic { background: #fdf0f0; border: 1px solid #e8b4b4; }
  .profile-box h5 { font-weight: 700; margin-bottom: 8px; font-size: 0.88rem; }
  .profile-box.happy    h5 { color: #186a3b; }
  .profile-box.balanced h5 { color: #7d6608; }
  .profile-box.academic h5 { color: #8e1010; }
  .profile-row { display: flex; gap: 8px; margin-bottom: 5px; }
  .profile-label { min-width: 60px; flex-shrink: 0; font-weight: 600; color: var(--sub); font-size: 0.8rem; }
  .profile-val { font-size: 0.82rem; color: var(--text); }

  #wm-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  #wm-overlay::before, #wm-overlay::after {
    content: '屯門區津貼小學全攻略 · 版權所有';
    position: absolute;
    font-size: 1rem;
    color: rgba(26,82,118,0.055);
    font-weight: 700;
    white-space: nowrap;
    transform: rotate(-30deg);
    top: 30%;
    left: -10%;
    right: -10%;
    letter-spacing: 0.2em;
  }
  #wm-overlay::after { top: 65%; }

  .protect-blur * { filter: blur(8px) !important; transition: filter 0.2s; }

  footer {
    text-align: center;
    padding: 24px 16px 110px;
    color: var(--sub);
    font-size: 0.78rem;
    line-height: 1.8;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* ── View toggle tabs ─────────────────────────────────────────── */
  .view-tabs {
    display: flex;
    background: var(--card);
    border-bottom: 2px solid var(--border);
  }
  .view-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: none;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--sub);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.15s;
  }
  .view-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--bg); }

  /* ── Map ───────────────────────────────────────────────────────── */
  #map-view { display: none; }
  #map-view.active { display: block; }
  #map-container {
    height: calc(100vh - 220px);
    min-height: 380px;
    width: 100%;
  }
  .map-toolbar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
  }
  .map-toolbar-label { font-size: 0.78rem; color: var(--sub); }
  .map-btn {
    border: 1.5px solid var(--border);
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .map-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .map-btn.locate-btn { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .map-legend {
    display: flex;
    gap: 14px;
    margin-left: auto;
    align-items: center;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--sub); }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.happy    { background: #27ae60; }
  .legend-dot.balanced { background: #e67e22; }
  .legend-dot.academic { background: #c0392b; }
  .legend-dot.unknown  { background: #2980b9; }

  /* Custom Leaflet popup */
  .leaflet-popup-content { margin: 10px 14px; min-width: 190px; }
  .popup-name { font-size: 0.9rem; font-weight: 700; color: var(--primary); margin-bottom: 5px; line-height: 1.3; }
  .popup-eng  { font-size: 0.7rem; color: var(--sub); margin-bottom: 7px; }
  .popup-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
  .popup-tag  { font-size: 0.68rem; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
  .popup-row  { font-size: 0.75rem; color: var(--sub); margin-bottom: 3px; }
  .popup-row b { color: var(--text); }
  .popup-btn  {
    display: block; width: 100%; margin-top: 8px;
    border: none; background: var(--primary); color: #fff;
    border-radius: 7px; padding: 6px; font-size: 0.78rem;
    font-weight: 600; cursor: pointer; text-align: center;
  }

  @media (max-width: 640px) {
    #map-container { height: calc(100vh - 200px); min-height: 320px; }
    .map-toolbar { padding: 8px 10px; gap: 6px; }
    .map-legend { gap: 8px; }
    .view-tab { font-size: 0.82rem; padding: 9px 6px; }
  }

  /* ── Ad slots ─────────────────────────────────────────────────── */
  .ad-slot {
    width: 100%;
    text-align: center;
    padding: 10px 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    color: var(--sub);
    font-size: 0.72rem;
  }
  .ad-slot ins { display: block; margin: 0 auto; }

  /* ── Mobile-first overrides ────────────────────────────────────── */
  @media (max-width: 640px) {
    header { padding: 20px 14px 14px; }
    header h1 { font-size: 1.15rem; }
    header p  { font-size: 0.78rem; }
    .net-badges { gap: 6px; }
    .net-badge  { font-size: 0.72rem; padding: 3px 10px; }

    .stats-bar { gap: 10px; font-size: 0.74rem; padding: 8px 12px; }

    .controls { padding: 10px 12px; }
    .search-input { font-size: 0.85rem; padding: 8px 12px; }

    /* Filter rows scroll horizontally instead of wrapping */
    .filter-row {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
      gap: 5px;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-btn { flex-shrink: 0; font-size: 0.76rem; padding: 4px 11px; white-space: nowrap; }

    .sort-row { font-size: 0.76rem; }
    .sort-select { font-size: 0.76rem; }

    .school-grid {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 10px;
    }

    .card-name { font-size: 0.95rem; }
    .card-eng  { font-size: 0.68rem; }

    /* Modal goes full-screen on mobile */
    .modal { padding: 0; align-items: flex-end; }
    .modal-box {
      max-height: 92vh;
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 100%;
    }
    .modal-box[style*="820px"] { max-width: 100%; }

    /* Compare table scrolls horizontally */
    .compare-table { font-size: 0.74rem; }
    .compare-table th, .compare-table td { padding: 7px 8px; }

    /* Compare bar safe-area bottom */
    .compare-bar { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }

    /* Footer safe-area */
    footer { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }

    .profile-snippet { font-size: 0.72rem; }
    .profile-box { font-size: 0.79rem; }
  }

  @media (max-width: 380px) {
    header h1 { font-size: 1rem; }
    .card-code { font-size: 0.66rem; }
  }
</style>
</head>
<body>

<header>
  <h1>屯門區津貼小學全攻略 2026</h1>
  <p>2026年度小一入學統一派位 · 學校網70及71</p>
  <div class="net-badges">
    <div class="net-badge">學校網 70 — 19間</div>
    <div class="net-badge">學校網 71 — 15間</div>
    <div class="net-badge">共34間學校</div>
  </div>
</header>

<div class="stats-bar">
  <span>資助 <b>33</b> 間 · 官立 <b>1</b> 間</span>
  <span>2026年度總暫定學額 <b id="total-places">—</b> 個</span>
</div>

<!-- View tabs -->
<div class="view-tabs">
  <button class="view-tab active" id="tab-grid" onclick="switchView('grid')">🗂 卡片列表</button>
  <button class="view-tab" id="tab-map"  onclick="switchView('map')">🗺 地圖查看</button>
</div>

<!-- Map view -->
<div id="map-view">
  <div class="map-toolbar">
    <span class="map-toolbar-label">顯示：</span>
    <button class="map-btn" id="mapf-all"  onclick="setMapFilter('all',this)">全部</button>
    <button class="map-btn" id="mapf-70"   onclick="setMapFilter('net70',this)">網70</button>
    <button class="map-btn" id="mapf-71"   onclick="setMapFilter('net71',this)">網71</button>
    <button class="map-btn" id="mapf-hap"  onclick="setMapFilter('happy',this)">😊 快樂</button>

  skhmungyn:{type:'balanced', placement:'區內一般派位',                                   philosophy:'聖公會，培養閱讀文化，兩文三語',                                   homework:'中等'},
  plkwwcfly:{type:'academic', placement:'保良局聯繫中學，兩度獲傑出小學獎',              philosophy:'6C素養，STEAM+資優教育，P1不設測驗考試（但學術嚴謹）',           homework:'輕至中，質量並重'},
  twghstsk: {type:'balanced', placement:'區內一般派位',                                   philosophy:'東華三院辦學，全人發展，五育均衡',                                 homework:'中等'},
  ychhsn:   {type:'academic', placement:'29% Band 1，37% Band 1-2（2025）',              philosophy:'仁濟精神，STEM重點，2019年新校設備完善',                           homework:'中等，平穩升小一過渡'},
  yotlwf:   {type:'happy',    placement:'區內一般派位',                                   philosophy:'仁愛誠勤，每日最多1-2份功課，週二/三/五設校內功課輔導',           homework:'輕，校內功課輔導免費'},
  stfalee:  {type:'academic', placement:'順德聯誼總會聯繫中學',                           philosophy:'正向教育SUPER+框架，李金探索家資優培訓計劃',                       homework:'中等，小班教學'},
  stfawsk:  {type:'academic', placement:'約80%升Band 1-2，順德聯繫中學',                 philosophy:'成長型思維，數學/乒乓球見稱，P1不設考試，設功課輔導',              homework:'輕至中，P1採形成性評估'},
  stfahyt:  {type:'academic', placement:'93%獲首三志願，56%升讀英中，順德聯繫中學',      philosophy:'普通話浸潤教育，60+多元活動，全日文化沉浸學習',                    homework:'中等，重自主學習'},
};

const typeLabel = {happy:'😊 快樂學習', balanced:'⚖️ 均衡發展', academic:'📚 學術型'};
const typeCls   = {happy:'happy', balanced:'balanced', academic:'academic'};

const maxPlaces = Math.max(...S.map(s => s.places));
document.getElementById('total-places').textContent = S.reduce((a, s) => a + s.places, 0);

let activeFilters = { net: 'all', religion: 'all', type: 'all' };
let compareList = [];

function setFilter(type, val, btn) {
  activeFilters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (val !== 'all') trackEvent('filter_used', {filter_type: type, filter_value: val});
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  let list = S.filter(s => {
    if (activeFilters.net !== 'all' && s.net !== parseInt(activeFilters.net)) return false;
    if (activeFilters.religion === 'none' && s.religion !== '') return false;
    if (activeFilters.religion !== 'all' && activeFilters.religion !== 'none' && s.religion !== activeFilters.religion) return false;
    if (activeFilters.type !== 'all' && (PROFILES[s.id]||{}).type !== activeFilters.type) return false;
    if (q && !s.name.toLowerCase().includes(q) && !s.eng.toLowerCase().includes(q)) return false;
    return true;
  });
  if (sort === 'places_desc') list.sort((a, b) => b.places - a.places);
  else if (sort === 'places_asc') list.sort((a, b) => a.places - b.places);
  else if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  else list.sort((a, b) => a.code - b.code);
  renderGrid(list);
  document.getElementById('resultCount').textContent = `顯示 ${list.length} / ${S.length} 間`;
  document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
  document.getElementById('schoolGrid').style.display = list.length ? '' : 'none';
}

function renderGrid(list) {
  document.getElementById('schoolGrid').innerHTML = list.map(s => {
    const inCompare = compareList.includes(s.id);
    const pct = Math.round((s.places / maxPlaces) * 100);
    return `
    <div class="school-card${inCompare ? ' selected-compare' : ''}" id="card-${s.id}">
      <div class="card-header">
        <div class="card-code-row">
          <span class="card-code net${s.net}-badge">網${s.net} · ${s.code}</span>
          <span class="card-places">學額 ${s.places}</span>
        </div>
        <div class="card-name">${s.name}</div>
        <div class="card-eng">${s.eng}</div>
      </div>
      <div class="card-body">
        <div class="card-tags">
          <span class="tag ${s.finance === '官立' ? 'tag-gov' : 'tag-finance'}">${s.finance}</span>
          ${s.religion ? `<span class="tag tag-religion">${s.religion}</span>` : ''}
          ${s.barrier ? `<span class="tag tag-barrier">♿</span>` : ''}
          ${PROFILES[s.id] ? `<span class="tag tag-${typeCls[PROFILES[s.id].type]}">${typeLabel[PROFILES[s.id].type]}</span>` : ''}
        </div>
        <div class="places-bar-wrap">
          <div class="places-bar-label"><span>暫定小一學額</span><span>${s.places} 個</span></div>
          <div class="places-bar-bg"><div class="places-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="card-info-row"><span class="icon">📍</span><span>${s.addr}</span></div>
        <div class="card-info-row"><span class="icon">📞</span><span>${s.tel}</span></div>
        ${PROFILES[s.id] ? `<div class="profile-snippet"><b>升學：</b>${PROFILES[s.id].placement}</div>` : ''}
      </div>
      <div class="card-footer">
        <button class="btn-compare${inCompare ? ' active' : ''}" onclick="toggleCompare('${s.id}')">${inCompare ? '✓ 已選' : '+ 比較'}</button>
        <button class="btn-detail" onclick="openDetail('${s.id}')">詳細資料</button>
      </div>
    </div>`;
  }).join('');
}

function toggleCompare(id) {
  if (compareList.includes(id)) {
    compareList = compareList.filter(x => x !== id);
  } else {
    if (compareList.length >= 3) { alert('最多同時比較3間學校'); return; }
    compareList.push(id);
  }
  updateCompareBar();
  applyFilters();
}

function updateCompareBar() {
  const bar = document.getElementById('compareBar');
  if (compareList.length === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('compareNames').innerHTML = compareList
    .map(id => S.find(s => s.id === id))
    .map(s => `<span>${s.name}</span>`).join('');
}

function clearCompare() { compareList = []; updateCompareBar(); applyFilters(); }

function openCompare() {
  if (compareList.length < 2) { alert('請選擇至少2間學校進行比較'); return; }
  trackEvent('compare_schools', {schools: compareList.join(','), count: compareList.length});
  const schools = compareList.map(id => S.find(s => s.id === id));
  const rows = [
    ['學校網', s => `網${s.net}`],
    ['學校編號', s => `${s.code}`],
    ['資助類別', s => s.finance],
    ['宗教', s => s.religion || '非宗教'],
    ['學校風格', s => PROFILES[s.id] ? typeLabel[PROFILES[s.id].type] : '—'],
    ['暫定學額', s => `${s.places} 個`],
    ['升學結果', s => PROFILES[s.id] ? PROFILES[s.id].placement : '—'],
    ['教育方針', s => PROFILES[s.id] ? PROFILES[s.id].philosophy : '—'],
    ['功課量', s => PROFILES[s.id] ? PROFILES[s.id].homework : '—'],
    ['地址', s => s.addr],
    ['電話', s => s.tel],
    ['無障礙設施', s => s.barrier ? '✓ 有' : '—'],
  ];
  let html = `<div style="overflow-x:auto"><table class="compare-table">
    <tr><th style="min-width:80px">項目</th>${schools.map(s => `<th>${s.name}</th>`).join('')}</tr>
    ${rows.map(([label, fn]) => `<tr><td class="row-label">${label}</td>${schools.map(s => `<td>${fn(s)}</td>`).join('')}</tr>`).join('')}
  </table></div>`;
  document.getElementById('compareBody').innerHTML = html;
  document.getElementById('compareModal').classList.add('open');
}

function closeCompare() { document.getElementById('compareModal').classList.remove('open'); }

function trackEvent(name, params) {
  if (typeof gtag !== 'undefined') gtag('event', name, params);
}

function openDetail(id) {
  const s = S.find(x => x.id === id);
  if (!s) return;
  trackEvent('view_school', {school_name: s.name, school_net: s.net, school_code: s.code});
  document.getElementById('detailTitle').textContent = s.name;
  const pct = Math.round((s.places / maxPlaces) * 100);
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-section">
      <h4>基本資料</h4>
      <div class="detail-row"><span class="detail-label">學校編號</span><span class="detail-value">${s.code}</span></div>
      <div class="detail-row"><span class="detail-label">學校網</span><span class="detail-value">學校網 ${s.net}</span></div>
      <div class="detail-row"><span class="detail-label">英文名稱</span><span class="detail-value">${s.eng}</span></div>
      <div class="detail-row"><span class="detail-label">資助類別</span><span class="detail-value">${s.finance}</span></div>
      <div class="detail-row"><span class="detail-label">宗教</span><span class="detail-value">${s.religion || '非宗教'}</span></div>
      <div class="detail-row"><span class="detail-label">無障礙設施</span><span class="detail-value">${s.barrier ? '✓ 有' : '未有資料'}</span></div>
    </div>
    <div class="detail-section">
      <h4>聯絡及位置</h4>
      <div class="detail-row"><span class="detail-label">地址</span><span class="detail-value">${s.addr}</span></div>
      <div class="detail-row"><span class="detail-label">電話</span><span class="detail-value">${s.tel}</span></div>
    </div>
    <div class="detail-section">
      <h4>2026年度暫定小一學額</h4>
      <div class="places-bar-wrap" style="margin:10px 0">
        <div class="places-bar-label"><span>${s.name}</span><span><b>${s.places}</b> 個</span></div>
        <div class="places-bar-bg" style="height:12px"><div class="places-bar-fill" style="width:${pct}%"></div></div>
        <div style="font-size:0.73rem;color:var(--sub);margin-top:4px">佔屯門區最高學額（${maxPlaces}個）的 ${pct}%</div>
      </div>
    </div>
    ${PROFILES[s.id] ? `
    <div class="detail-section">
      <h4>學校評估</h4>
      <div class="profile-box ${typeCls[PROFILES[s.id].type]}">
        <h5>${typeLabel[PROFILES[s.id].type]}</h5>
        <div class="profile-row"><span class="profile-label">🎓 升學</span><span class="profile-val">${PROFILES[s.id].placement}</span></div>
        <div class="profile-row"><span class="profile-label">📖 方針</span><span class="profile-val">${PROFILES[s.id].philosophy}</span></div>
        <div class="profile-row"><span class="profile-label">📝 功課</span><span class="profile-val">${PROFILES[s.id].homework}</span></div>
      </div>
    </div>` : ''}
    <div class="detail-section">
      <h4>入學須知</h4>
      <div class="admission-box">
        <h5>統一派位制度（資助/官立小學）</h5>
        <ul>
          <li>本校屬<b>學校網 ${s.net}</b>，住址在網${s.net}內的家長可在乙部填選本校</li>
          <li>甲部可填寫全港任何官立或資助小學（不受學校網限制）</li>
          <li>統一派位以電腦隨機分配，毋須面試</li>
          <li>自行分配（叩門）階段：另設，詳情請直接向學校查詢</li>
          <li>「世紀學校先修課程」或「特殊教育需要統籌主任」計劃等，請向各校查詢</li>
        </ul>
      </div>
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

applyFilters();

// ── View toggle ──────────────────────────────────────────────────────────
let currentView = 'grid';
function switchView(v) {
  currentView = v;
  document.getElementById('tab-grid').classList.toggle('active', v === 'grid');
  document.getElementById('tab-map').classList.toggle('active', v === 'map');
  document.getElementById('map-view').classList.toggle('active', v === 'map');
  const adTop = document.getElementById('ad-top');
  const grid  = document.getElementById('schoolGrid');
  const empty = document.getElementById('emptyState');
  const controls = document.querySelector('.controls');
  if (v === 'map') {
    if (adTop) adTop.style.display = 'none';
    grid.style.display = 'none';
    empty.style.display = 'none';
    controls.style.display = 'none';
    initMap();
    trackEvent('view_map', {});
  } else {
    if (adTop) adTop.style.display = '';
    controls.style.display = '';
    applyFilters();
  }
}

// ── Map ───────────────────────────────────────────────────────────────────
let map = null, markers = [], userMarker = null, mapFilter = 'all';

const markerColor = {happy:'#27ae60', balanced:'#e67e22', academic:'#c0392b', undefined:'#2980b9'};

function makeIcon(type) {
  const c = markerColor[type] || markerColor.undefined;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="38" viewBox="0 0 28 38">
    <path d="M14 0C6.27 0 0 6.27 0 14c0 9.33 14 24 14 24S28 23.33 28 14C28 6.27 21.73 0 14 0z" fill="${c}" stroke="white" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="6" fill="white"/>
  </svg>`;
  return L.divIcon({
    html: svg, className: '', iconSize:[28,38], iconAnchor:[14,38], popupAnchor:[0,-40]
  });
}

function buildPopup(s) {
  const p = PROFILES[s.id] || {};
  const tl = p.type ? typeLabel[p.type] : '';
  const tc = p.type ? `tag-${typeCls[p.type]}` : 'tag-finance';
  return `<div class="popup-name">${s.name}</div>
    <div class="popup-eng">${s.eng}</div>
    <div class="popup-tags">
      <span class="popup-tag tag-finance">網${s.net} · ${s.code}</span>
      ${tl ? `<span class="popup-tag ${tc}">${tl}</span>` : ''}
      ${s.religion ? `<span class="popup-tag tag-religion">${s.religion}</span>` : ''}
    </div>
    <div class="popup-row">📍 ${s.addr}</div>
    <div class="popup-row">📞 <b>${s.tel}</b></div>
    <div class="popup-row">🎓 學額 <b>${s.places}</b> 個</div>
    ${p.placement ? `<div class="popup-row">📊 ${p.placement}</div>` : ''}
    <button class="popup-btn" onclick="switchView('grid');setTimeout(()=>openDetail('${s.id}'),200)">查看詳情 →</button>`;
}

function schoolPassesMapFilter(s) {
  if (mapFilter === 'all') return true;
  if (mapFilter === 'net70') return s.net === 70;
  if (mapFilter === 'net71') return s.net === 71;
  const t = (PROFILES[s.id]||{}).type;
  return t === mapFilter;
}

function initMap() {
  if (map) { refreshMapMarkers(); return; }
  map = L.map('map-container', {zoomControl: true}).setView([22.395, 113.974], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  S.forEach(s => {
    const type = (PROFILES[s.id]||{}).type;
    const m = L.marker([s.lat, s.lng], {icon: makeIcon(type)})
      .bindPopup(buildPopup(s), {maxWidth: 240})
      .addTo(map);
    m._schoolId = s.id;
    m._schoolNet = s.net;
    m._schoolType = type;
    markers.push(m);
  });
}

function refreshMapMarkers() {
  markers.forEach(m => {
    const s = S.find(x => x.id === m._schoolId);
    if (schoolPassesMapFilter(s)) { map.addLayer(m); } else { map.removeLayer(m); }
  });
}

function setMapFilter(f, btn) {
  mapFilter = f;
  document.querySelectorAll('.map-btn:not(.locate-btn)').forEach(b => b.style.background = '');
  btn.style.background = 'var(--primary)';
  btn.style.color = '#fff';
  refreshMapMarkers();
}

function locateMe() {
  if (!map) return;
  if (!navigator.geolocation) { alert('此裝置不支援定位功能'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude: lat, longitude: lng} = pos.coords;
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat, lng], {
      radius: 10, color: '#fff', weight: 3,
      fillColor: '#3498db', fillOpacity: 1
    }).addTo(map).bindPopup('📍 你的位置').openPopup();
    map.setView([lat, lng], 15);

    // Find nearest 3 schools and highlight
    const sorted = S.map(s => ({
      s, dist: Math.hypot(s.lat - lat, s.lng - lng)
    })).sort((a,b) => a.dist - b.dist).slice(0, 3);

    sorted.forEach(({s}, i) => {
      const m = markers.find(mk => mk._schoolId === s.id);
      if (m) {
        setTimeout(() => m.openPopup(), i * 600);
      }
    });

    trackEvent('locate_me', {lat: lat.toFixed(3), lng: lng.toFixed(3)});
  }, () => alert('無法取得定位，請確認已允許位置權限'));
}

// ── View & map end ────────────────────────────────────────────────────────

(function initProtection() {
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ['c','a','u','s','p'].includes(k)) e.preventDefault();
    if (e.key === 'PrintScreen' || e.key === 'F12') e.preventDefault();
  });
  document.documentElement.style.webkitTouchCallout = 'none';
  let blurTimer;
  const blur = () => document.body.classList.add('protect-blur');
  const unblur = () => { clearTimeout(blurTimer); blurTimer = setTimeout(() => document.body.classList.remove('protect-blur'), 800); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) blur(); else unblur(); });
  window.addEventListener('blur', blur);
  window.addEventListener('focus', unblur);
})();
</script>
</body>
</html>
