<style>

  .tag-barrier { background: #e8f8e8; color: #186a3b; }

  .tag-balanced { background: #fef9e7; color: #7d6608; }

  .btn-detail:hover { background: var(--accent); }
  .compare-bar {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;

  .modal {
    display: none; position: fixed; inset: 0;

    align-items: center; justify-content: center; padding: 16px;

  .modal.open { display: flex; }
  .modal-box {
    background: var(--card); border-radius: var(--radius); width: 100%;

  .modal-head {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;

  .modal-head h3 { font-size: 1rem; color: var(--primary); font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 1.3rem; color: var(--sub); cursor: pointer; padding: 4px 8px; }
  .modal-body { padding: 20px; }
  .compare-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .compare-table th { background: var(--primary); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; }
  .compare-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .compare-table tr:nth-child(even) td { background: var(--bg); }

    font-size: 0.82rem; font-weight: 700; color: var(--accent);

  .detail-value { color: var(--text); font-weight: 500; }
  .admission-box {
    background: linear-gradient(135deg, #eef4fa, #e8f4ee);

  .profile-box.happy    { background: #edfbee; border: 1px solid #a9dbb0; }
  .profile-box.balanced { background: #fefce8; border: 1px solid #d4c56a; }
  .profile-box.academic { background: #fdf0f0; border: 1px solid #e8b4b4; }
  .profile-box h5 { font-weight: 700; margin-bottom: 8px; font-size: 0.88rem; }
  .profile-box.happy    h5 { color: #186a3b; }
  .profile-box.balanced h5 { color: #7d6608; }
  .profile-box.academic h5 { color: #8e1010; }
  .profile-row { display: flex; gap: 8px; margin-bottom: 5px; }
  .profile-label { min-width: 60px; flex-shrink: 0; font-weight: 600; color: var(--sub); font-size: 0.8rem; }
  .profile-val { font-size: 0.82rem; color: var(--text); }
  #wm-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }

    content: '荃灣區津貼小學全攻略 · 版權所有';
    position: absolute; font-size: 1rem; color: rgba(26,82,118,0.055);
    font-weight: 700; white-space: nowrap; transform: rotate(-30deg);
    top: 30%; left: -10%; right: -10%; letter-spacing: 0.2em;
  }
  #wm-overlay::after { top: 65%; }
  .protect-blur * { filter: blur(8px) !important; transition: filter 0.2s; }
  footer { text-align: center; padding: 24px 16px 110px; color: var(--sub); font-size: 0.78rem; line-height: 1.8; }
  footer a { color: var(--accent); text-decoration: none; }
  .view-tabs { display: flex; background: var(--card); border-bottom: 2px solid var(--border); }
  .view-tab {
    flex: 1; padding: 10px; border: none; background: none;
    font-size: 0.88rem; font-weight: 600; color: var(--sub);
    cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s;
  }
  .view-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--bg); }

  #map-container { height: calc(100vh - 220px); min-height: 380px; width: 100%; }
  .map-toolbar {
    display: flex; gap: 8px; padding: 10px 14px; background: var(--card);
    border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap;
  }
  .map-toolbar-label { font-size: 0.78rem; color: var(--sub); }
  .map-btn {
    border: 1.5px solid var(--border); background: var(--tag-bg); color: var(--tag-text);
    border-radius: 20px; padding: 5px 13px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .map-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .map-btn.locate-btn { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .map-legend { display: flex; gap: 14px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--sub); }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.happy    { background: #27ae60; }
  .legend-dot.balanced { background: #e67e22; }
  .legend-dot.academic { background: #c0392b; }
  .leaflet-popup-content { margin: 10px 14px; min-width: 190px; }
  .popup-name { font-size: 0.9rem; font-weight: 700; color: var(--primary); margin-bottom: 5px; line-height: 1.3; }
  .popup-eng  { font-size: 0.7rem; color: var(--sub); margin-bottom: 7px; }
  .popup-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
  .popup-tag  { font-size: 0.68rem; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
  .popup-row  { font-size: 0.75rem; color: var(--sub); margin-bottom: 3px; }
  .popup-row b { color: var(--text); }
  .popup-btn  { display: block; width: 100%; margin-top: 8px; border: none; background: var(--primary); color: #fff; border-radius: 7px; padding: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; text-align: center; }

    #map-container { height: calc(100vh - 200px); min-height: 320px; }

    .map-legend { gap: 8px; }
    .view-tab { font-size: 0.82rem; padding: 9px 6px; }
    header { padding: 20px 14px 14px; }
    header h1 { font-size: 1.15rem; }
    header p  { font-size: 0.78rem; }

    .sort-select { font-size: 0.76rem; }

    .card-name { font-size: 0.95rem; }
    .card-eng  { font-size: 0.68rem; }

    .compare-table { font-size: 0.74rem; }

    .profile-box { font-size: 0.79rem; }
  }
  @media (max-width: 380px) { header h1 { font-size: 1rem; } .card-code { font-size: 0.66rem; } }

<header>
  <h1>荃灣區津貼小學全攻略 2026</h1>
  <p>2026年度小一入學統一派位 · 學校網62</p>
  <div class="net-badges">
    <div class="net-badge">網62 荃灣區 — 21間</div>
    <div class="net-badge">官立 2間 · 資助 19間</div>
    <div class="net-badge">涵蓋荃灣市、梨木樹、深井、馬灣</div>
  </div>
</header>

<div class="stats-bar">
  <span>資助 <b>19</b> 間 · 官立 <b>2</b> 間</span>
  <span>2026年度總暫定學額 <b id="total-places">—</b> 個</span>
</div>

<div class="view-tabs">
  <button class="view-tab active" id="tab-grid" onclick="switchView('grid')">🗂 卡片列表</button>
  <button class="view-tab" id="tab-map"  onclick="switchView('map')">🗺 地圖查看</button>
</div>

<div id="map-view">
  <div class="map-toolbar">
    <span class="map-toolbar-label">顯示：</span>
    <button class="map-btn" id="mapf-all"  onclick="setMapFilter('all',this)">全部</button>
    <button class="map-btn" id="mapf-62"   onclick="setMapFilter('net62',this)">網62</button>
    <button class="map-btn" id="mapf-hap"  onclick="setMapFilter('happy',this)">😊 快樂</button>
    <button class="map-btn" id="mapf-bal"  onclick="setMapFilter('balanced',this)">⚖️ 均衡</button>
    <button class="map-btn" id="mapf-aca"  onclick="setMapFilter('academic',this)">📚 學術</button>
    <button class="map-btn locate-btn" onclick="locateMe()">📍 找附近學校</button>
    <div class="map-legend">
      <div class="legend-item"><div class="legend-dot happy"></div>快樂</div>
      <div class="legend-item"><div class="legend-dot balanced"></div>均衡</div>
      <div class="legend-item"><div class="legend-dot academic"></div>學術</div>
    </div>
  </div>
  <div id="map-container"></div>
</div>

<div class="ad-slot" id="ad-top">
  <!-- AdSense 批准後貼上廣告代碼
  <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9733417337373745" data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  -->
  <span>— 廣告 —</span>
</div>

<div class="controls">
  <div class="search-row">
    <input class="search-input" type="text" id="searchInput" placeholder="搜尋學校名稱（中文或英文）…" oninput="applyFilters()">
  </div>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="net" data-val="all" onclick="setFilter('net','all',this)">全部學校網</button>
    <button class="filter-btn net72-btn" data-filter="net" data-val="62" onclick="setFilter('net','62',this)">網62 荃灣區</button>
    <button class="filter-btn" data-filter="religion" data-val="all" onclick="setFilter('religion','all',this)">全部</button>
    <button class="filter-btn" data-filter="religion" data-val="基督教" onclick="setFilter('religion','基督教',this)">基督教</button>

const maxPlaces = Math.max(...S.map(s => s.places));
document.getElementById('total-places').textContent = S.reduce((a, s) => a + s.places, 0);

let activeFilters = {net:'all', religion:'all', type:'all'};
let compareList = [];

function setFilter(type, val, btn) {
  activeFilters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (val !== 'all') trackEvent('filter_used', {filter_type:type, filter_value:val});
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  let list = S.filter(s => {
    if (activeFilters.net !== 'all' && s.net !== parseInt(activeFilters.net)) return false;
    if (activeFilters.religion === 'none' && s.religion !== '') return false;
    if (activeFilters.religion !== 'all' && activeFilters.religion !== 'none' && s.religion !== activeFilters.religion) return false;
    if (activeFilters.type !== 'all' && (PROFILES[s.id]||{}).type !== activeFilters.type) return false;
    if (q && !s.name.toLowerCase().includes(q) && !s.eng.toLowerCase().includes(q)) return false;
    return true;
  });
  if (sort === 'places_desc') list.sort((a,b) => b.places - a.places);
  else if (sort === 'places_asc') list.sort((a,b) => a.places - b.places);
  else if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name,'zh-Hant'));
  else list.sort((a,b) => a.code - b.code);
  renderGrid(list);
  document.getElementById('resultCount').textContent = `顯示 ${list.length} / ${S.length} 間`;
  document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
  document.getElementById('schoolGrid').style.display = list.length ? '' : 'none';
}

function renderGrid(list) {
  const netName = n => '荃灣區';
  document.getElementById('schoolGrid').innerHTML = list.map(s => {
    const inCompare = compareList.includes(s.id);
    const pct = Math.round((s.places / maxPlaces) * 100);
    return `
    <div class="school-card${inCompare?' selected-compare':''}" id="card-${s.id}">
      <div class="card-header">
        <div class="card-code-row">
          <span class="card-code net${s.net}-badge">網${s.net} ${netName(s.net)} · ${s.code}</span>
          <span class="card-places">學額 ${s.places}</span>
        </div>
        <div class="card-name">${s.name}</div>
        <div class="card-eng">${s.eng}</div>
      </div>
      <div class="card-body">
        <div class="card-tags">
          <span class="tag ${s.finance==='官立'?'tag-gov':'tag-finance'}">${s.finance}</span>
          ${s.religion?`<span class="tag tag-religion">${s.religion}</span>`:''}
          ${s.barrier?`<span class="tag tag-barrier">♿</span>`:''}
          ${PROFILES[s.id]?`<span class="tag tag-${typeCls[PROFILES[s.id].type]}">${typeLabel[PROFILES[s.id].type]}</span>`:''}
        </div>
        <div class="places-bar-wrap">
          <div class="places-bar-label"><span>暫定小一學額</span><span>${s.places} 個</span></div>
          <div class="places-bar-bg"><div class="places-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="card-info-row"><span class="icon">📍</span><span>${s.addr}</span></div>
        <div class="card-info-row"><span class="icon">📞</span><span>${s.tel}</span></div>
        ${PROFILES[s.id]?`<div class="profile-snippet"><b>升學：</b>${PROFILES[s.id].placement}</div>`:''}
      </div>
      <div class="card-footer">
        <button class="btn-compare${inCompare?' active':''}" onclick="toggleCompare('${s.id}')">${inCompare?'✓ 已選':'+ 比較'}</button>
        <button class="btn-detail" onclick="openDetail('${s.id}')">詳細資料</button>
      </div>
    </div>`;
  }).join('');
}

function toggleCompare(id) {
  if (compareList.includes(id)) { compareList = compareList.filter(x => x!==id); }
  else { if (compareList.length>=3){alert('最多同時比較3間學校');return;} compareList.push(id); }
  updateCompareBar(); applyFilters();
}

function updateCompareBar() {
  const bar = document.getElementById('compareBar');
  if (!compareList.length) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('compareNames').innerHTML = compareList.map(id=>S.find(s=>s.id===id)).map(s=>`<span>${s.name}</span>`).join('');
}

function clearCompare() { compareList=[]; updateCompareBar(); applyFilters(); }

function openCompare() {
  if (compareList.length<2){alert('請選擇至少2間學校進行比較');return;}
  trackEvent('compare_schools',{schools:compareList.join(','),count:compareList.length});
  const schools = compareList.map(id=>S.find(s=>s.id===id));
  const netName = n => '荃灣區';
  const rows = [
    ['學校網',s=>`網${s.net}（${netName(s.net)}）`],
    ['學校編號',s=>`${s.code}`],
    ['資助類別',s=>s.finance],
    ['宗教',s=>s.religion||'非宗教'],
    ['學校風格',s=>PROFILES[s.id]?typeLabel[PROFILES[s.id].type]:'—'],
    ['暫定學額',s=>`${s.places} 個`],
    ['升學結果',s=>PROFILES[s.id]?PROFILES[s.id].placement:'—'],
    ['教育方針',s=>PROFILES[s.id]?PROFILES[s.id].philosophy:'—'],
    ['功課量',s=>PROFILES[s.id]?PROFILES[s.id].homework:'—'],
    ['地址',s=>s.addr],['電話',s=>s.tel],
    ['無障礙設施',s=>s.barrier?'✓ 有':'—'],
  ];
  document.getElementById('compareBody').innerHTML = `<div style="overflow-x:auto"><table class="compare-table">
    <tr><th style="min-width:80px">項目</th>${schools.map(s=>`<th>${s.name}</th>`).join('')}</tr>
    ${rows.map(([l,fn])=>`<tr><td class="row-label">${l}</td>${schools.map(s=>`<td>${fn(s)}</td>`).join('')}</tr>`).join('')}
  </table></div>`;
  document.getElementById('compareModal').classList.add('open');
}

function closeCompare() { document.getElementById('compareModal').classList.remove('open'); }
function trackEvent(name,params) { if(typeof gtag!=='undefined') gtag('event',name,params); }

function openDetail(id) {
  const s = S.find(x=>x.id===id);
  if(!s) return;
  trackEvent('view_school',{school_name:s.name,school_net:s.net,school_code:s.code});
  document.getElementById('detailTitle').textContent = s.name;
  const pct = Math.round((s.places/maxPlaces)*100);
  const netLabel = '荃灣區';
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-section">
      <h4>基本資料</h4>
      <div class="detail-row"><span class="detail-label">學校編號</span><span class="detail-value">${s.code}</span></div>
      <div class="detail-row"><span class="detail-label">學校網</span><span class="detail-value">學校網 ${s.net}（${netLabel}）</span></div>
      <div class="detail-row"><span class="detail-label">英文名稱</span><span class="detail-value">${s.eng}</span></div>
      <div class="detail-row"><span class="detail-label">資助類別</span><span class="detail-value">${s.finance}</span></div>
      <div class="detail-row"><span class="detail-label">宗教</span><span class="detail-value">${s.religion||'非宗教'}</span></div>
      <div class="detail-row"><span class="detail-label">無障礙設施</span><span class="detail-value">${s.barrier?'✓ 有':'未有資料'}</span></div>
    </div>
    <div class="detail-section">
      <h4>聯絡及位置</h4>
      <div class="detail-row"><span class="detail-label">地址</span><span class="detail-value">${s.addr}</span></div>
      <div class="detail-row"><span class="detail-label">電話</span><span class="detail-value">${s.tel}</span></div>
    </div>
    <div class="detail-section">
      <h4>2026年度暫定小一學額</h4>
      <div class="places-bar-wrap" style="margin:10px 0">
        <div class="places-bar-label"><span>${s.name}</span><span><b>${s.places}</b> 個</span></div>
        <div class="places-bar-bg" style="height:12px"><div class="places-bar-fill" style="width:${pct}%"></div></div>
        <div style="font-size:0.73rem;color:var(--sub);margin-top:4px">佔荃灣區最高學額（${maxPlaces}個）的 ${pct}%</div>
      </div>
    </div>
    ${PROFILES[s.id]?`
    <div class="detail-section">
      <h4>學校評估</h4>
      <div class="profile-box ${typeCls[PROFILES[s.id].type]}">
        <h5>${typeLabel[PROFILES[s.id].type]}</h5>
        <div class="profile-row"><span class="profile-label">🎓 升學</span><span class="profile-val">${PROFILES[s.id].placement}</span></div>
        <div class="profile-row"><span class="profile-label">📖 方針</span><span class="profile-val">${PROFILES[s.id].philosophy}</span></div>
        <div class="profile-row"><span class="profile-label">📝 功課</span><span class="profile-val">${PROFILES[s.id].homework}</span></div>
        ${PROFILES[s.id].teachers?`<div class="profile-row"><span class="profile-label">👩‍🏫 師資</span><span class="profile-val">${PROFILES[s.id].teachers}</span></div>`:''}
      </div>
    </div>`:''}
    <div class="detail-section">
      <h4>入學須知</h4>
      <div class="admission-box">
        <h5>統一派位制度（資助/官立小學）</h5>
        <ul>
          <li>本校屬<b>學校網 ${s.net}（${netLabel}）</b>，住址在網${s.net}內的家長可在乙部填選本校</li>
          <li>甲部可填寫全港任何官立或資助小學（不受學校網限制）</li>
          <li>統一派位以電腦隨機分配，毋須面試</li>
          <li>自行分配（叩門）階段：另設，詳情請直接向學校查詢</li>
          <li>💡 荃灣區只設一個學校網（網62），區內所有官立及資助小學均可在乙部填選</li>
        </ul>
      </div>
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

applyFilters();

let currentView = 'grid';
function switchView(v) {
  currentView = v;
  document.getElementById('tab-grid').classList.toggle('active', v==='grid');
  document.getElementById('tab-map').classList.toggle('active', v==='map');
  document.getElementById('map-view').classList.toggle('active', v==='map');
  const adTop = document.getElementById('ad-top');
  const grid  = document.getElementById('schoolGrid');
  const empty = document.getElementById('emptyState');
  const controls = document.querySelector('.controls');
  if (v==='map') {
    if(adTop) adTop.style.display='none';
    grid.style.display='none'; empty.style.display='none'; controls.style.display='none';
    initMap(); trackEvent('view_map',{});
  } else {
    if(adTop) adTop.style.display='';
    controls.style.display=''; applyFilters();
  }
}

let map=null, markers=[], userMarker=null, mapFilter='all';
const markerColor = {happy:'#27ae60', balanced:'#e67e22', academic:'#c0392b', undefined:'#2980b9'};

function makeIcon(type) {
  const c = markerColor[type]||markerColor.undefined;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="38" viewBox="0 0 28 38">
    <path d="M14 0C6.27 0 0 6.27 0 14c0 9.33 14 24 14 24S28 23.33 28 14C28 6.27 21.73 0 14 0z" fill="${c}" stroke="white" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="6" fill="white"/>
  </svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[28,38], iconAnchor:[14,38], popupAnchor:[0,-40]});
}

function buildPopup(s) {
  const p = PROFILES[s.id]||{};
  const tl = p.type?typeLabel[p.type]:'';
  const tc = p.type?`tag-${typeCls[p.type]}`:'tag-finance';
  const nName = '荃灣區';
  return `<div class="popup-name">${s.name}</div>
    <div class="popup-eng">${s.eng}</div>
    <div class="popup-tags">
      <span class="popup-tag tag-finance">網${s.net} ${nName} · ${s.code}</span>
      ${tl?`<span class="popup-tag ${tc}">${tl}</span>`:''}
      ${s.religion?`<span class="popup-tag tag-religion">${s.religion}</span>`:''}
    </div>
    <div class="popup-row">📍 ${s.addr}</div>
    <div class="popup-row">📞 <b>${s.tel}</b></div>
    <div class="popup-row">🎓 學額 <b>${s.places}</b> 個</div>
    ${p.placement?`<div class="popup-row">📊 ${p.placement}</div>`:''}
    <button class="popup-btn" onclick="switchView('grid');setTimeout(()=>openDetail('${s.id}'),200)">查看詳情 →</button>`;
}

function schoolPassesMapFilter(s) {
  if (mapFilter==='all') return true;
  if (mapFilter==='net62') return s.net===62;
  return (PROFILES[s.id]||{}).type===mapFilter;
}

function initMap() {
  if (map) { refreshMapMarkers(); return; }
  map = L.map('map-container',{zoomControl:true}).setView([22.3720,114.1120],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19
  }).addTo(map);
  S.forEach(s => {
    const type = (PROFILES[s.id]||{}).type;
    const m = L.marker([s.lat,s.lng],{icon:makeIcon(type)}).bindPopup(buildPopup(s),{maxWidth:240}).addTo(map);
    m._schoolId=s.id; m._schoolNet=s.net; m._schoolType=type;
    markers.push(m);
  });
}

function refreshMapMarkers() {
  markers.forEach(m => {
    const s = S.find(x=>x.id===m._schoolId);
    if (schoolPassesMapFilter(s)) { map.addLayer(m); } else { map.removeLayer(m); }
  });
}

function setMapFilter(f,btn) {
  mapFilter=f;
  document.querySelectorAll('.map-btn:not(.locate-btn)').forEach(b=>{b.style.background='';b.style.color='';});
  btn.style.background='var(--primary)'; btn.style.color='#fff';
  refreshMapMarkers();
}

function locateMe() {
  if (!map) return;
  if (!navigator.geolocation) { alert('此裝置不支援定位功能'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude:lat, longitude:lng} = pos.coords;
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat,lng],{radius:10,color:'#fff',weight:3,fillColor:'#3498db',fillOpacity:1})
      .addTo(map).bindPopup('📍 你的位置').openPopup();
    map.setView([lat,lng],15);
    S.map(s=>({s,dist:Math.hypot(s.lat-lat,s.lng-lng)})).sort((a,b)=>a.dist-b.dist).slice(0,3)
      .forEach(({s},i) => { const m=markers.find(mk=>mk._schoolId===s.id); if(m) setTimeout(()=>m.openPopup(),i*600); });
    trackEvent('locate_me',{lat:lat.toFixed(3),lng:lng.toFixed(3)});
  }, ()=>alert('無法取得定位，請確認已允許位置權限'));
}

(function initProtection() {
  document.addEventListener('selectstart', e=>e.preventDefault());
  document.addEventListener('copy', e=>e.preventDefault());
  document.addEventListener('cut', e=>e.preventDefault());
  document.addEventListener('contextmenu', e=>e.preventDefault());
  document.addEventListener('keydown', e => {
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&['c','a','u','s','p'].includes(k)) e.preventDefault();
    if(e.key==='PrintScreen'||e.key==='F12') e.preventDefault();
  });
  document.documentElement.style.webkitTouchCallout='none';
  let blurTimer;
  const blur=()=>document.body.classList.add('protect-blur');
  const unblur=()=>{clearTimeout(blurTimer);blurTimer=setTimeout(()=>document.body.classList.remove('protect-blur'),800);};
  document.addEventListener('visibilitychange',()=>{if(document.hidden)blur();else unblur();});
  window.addEventListener('blur',blur);
  window.addEventListener('focus',unblur);
})();
</script>
</body>
</html>
